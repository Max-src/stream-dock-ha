name: Something doesn't work
description: A problem with the Windows app, its pads, keys or Mini Monitor
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For problems inside Home Assistant (its devices and entities, the dashboard cards, actions or blueprints), open an issue in [the Stream Dock HA integration](https://github.com/Max-src/stream-dock-ha-integration/issues) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: "1. Select key 3\n2. Drag it to key 7\n3. ..."
  - type: input
    id: app
    attributes:
      label: App version
      description: Next to the name at the top of the app's window, like v1.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: pads
    attributes:
      label: Pads
      placeholder: StreamDock 293S, AJAZZ AKP03E
  - type: input
    id: integration
    attributes:
      label: Integration version, if you use it
  - type: textarea
    id: logs
    attributes:
      label: pad-log.txt
      description: |
        The last lines of pad-log.txt, in %APPDATA%\StreamDockHA. Remove your Home Assistant address and anything private first. Never paste config.json: it holds your token, even if encrypted.
      render: text
